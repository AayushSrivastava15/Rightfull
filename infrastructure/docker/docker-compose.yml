services:
  postgres:
    image: postgres:16-alpine
    container_name: rightful-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rightful
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - rightful_pgdata:/var/lib/postgresql/data

volumes:
  rightful_pgdata:
    driver: local
