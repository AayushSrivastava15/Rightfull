# ==============================================================================
# RIGHTFUL BACKEND - LOCAL DEVELOPMENT PROFILE
# ==============================================================================
# PostgreSQL / Supabase Datasource
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rightful}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Supabase Auth / JWT Validation (OAuth2 Resource Server)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWT_JWKS_URL:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}
