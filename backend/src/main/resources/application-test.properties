# ==============================================================================
# RIGHTFUL BACKEND - TEST PROFILE (IN-MEMORY H2)
# ==============================================================================
# In-Memory H2 Datasource with PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:rightfultest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Test Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Disabled in Test Context
spring.flyway.enabled=false

# Test Security Secret
rightful.security.hmac-secret=test_environment_only_hmac_secret_min_32_bytes_key_xyz
