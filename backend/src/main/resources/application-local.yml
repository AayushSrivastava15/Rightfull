spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rightful}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWT_JWKS_URL:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}
