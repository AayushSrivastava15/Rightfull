spring:
  application:
    name: rightfull-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# OpenAPI 3.1 / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Rightfull Licensing Platform Defaults
rightfull:
  licensing:
    default-grace-period-hours: ${RIGHTFULL_LICENSING_DEFAULT_GRACE_PERIOD_HOURS:7}
    default-validation-interval-minutes: ${RIGHTFULL_LICENSING_DEFAULT_VALIDATION_INTERVAL_MINUTES:5}
  security:
    hmac-secret: ${LICENSE_HMAC_SECRET:development_only_hmac_secret_min_32_bytes_long_key_001}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
