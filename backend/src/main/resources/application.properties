# ==============================================================================
# RIGHTFUL BACKEND - MAIN APPLICATION CONFIGURATION
# ==============================================================================
spring.application.name=rightful-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Actuator Endpoints & Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# OpenAPI 3.1 & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Rightful Licensing Policy Defaults
rightful.licensing.default-grace-period-hours=${RIGHTFUL_LICENSING_DEFAULT_GRACE_PERIOD_HOURS:7}
rightful.licensing.default-validation-interval-minutes=${RIGHTFUL_LICENSING_DEFAULT_VALIDATION_INTERVAL_MINUTES:5}

# Security Configuration
rightful.security.hmac-secret=${LICENSE_HMAC_SECRET:development_only_hmac_secret_min_32_bytes_long_key_001}
rightful.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

